name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.0.3-alpha.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  QT_QPA_PLATFORM: offscreen

jobs:
  build-and-publish:
    name: Verify, Package & Publish Release (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-base-dev-tools \
            fuse3 \
            libfuse3-dev \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/proton-drive-daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/proton-drive-daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rust formatting check
        run: cargo fmt --manifest-path crates/proton-drive-daemon/Cargo.toml --all -- --check

      - name: Rust strict Clippy lint
        run: cargo clippy --manifest-path crates/proton-drive-daemon/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --manifest-path crates/proton-drive-daemon/Cargo.toml --all-targets

      - name: Configure and build CMake native targets
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build -j"$(nproc)"

      - name: Run headless CTest suite
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Verify staged install.sh layout
        run: |
          DESTDIR=/tmp/neutron-drive-stage ./install.sh --prefix /usr
          test -x /tmp/neutron-drive-stage/usr/bin/neutron-drive-daemon
          test -x /tmp/neutron-drive-stage/usr/bin/neutron-drive-gui
          test -x /tmp/neutron-drive-stage/usr/bin/neutron-drive
          test -f /tmp/neutron-drive-stage/usr/share/applications/neutron-drive.desktop
          test -f /tmp/neutron-drive-stage/usr/share/systemd/user/neutron-drive.service

      - name: Build distribution packages (.deb, .rpm, .tar.gz)
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B build/packages
          cpack --config build/CPackConfig.cmake -G RPM -B build/packages
          cpack --config build/CPackConfig.cmake -G TGZ -B build/packages
          (cd build/packages && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS.txt)
          ls -lh build/packages/

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Neutron Drive ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.tar.gz
            build/packages/SHA256SUMS.txt
