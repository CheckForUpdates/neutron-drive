<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Orbital rings (Neutron Drive emblem) -->
  <g transform="translate(256 256)" fill="none" stroke="url(#orbitGrad)" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="154" ry="62" stroke-width="22" transform="rotate(-35)"/>
    <ellipse cx="0" cy="0" rx="154" ry="62" stroke-width="22" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="154" ry="62" stroke-width="18" stroke-opacity="0.7" transform="rotate(90)"/>
  </g>

  <!-- Central nucleus -->
  <circle cx="256" cy="256" r="38" fill="#ffffff"/>
  <circle cx="256" cy="256" r="18" fill="#0d9488"/>

  <!-- Satellite electron nodes -->
  <circle cx="144" cy="176" r="16" fill="#99f6e4"/>
  <circle cx="368" cy="336" r="16" fill="#e0f2fe"/>
</svg>
