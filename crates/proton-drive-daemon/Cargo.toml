[package]
name = "neutron-drive-daemon"
version = "3.0.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Unofficial native Rust FUSE daemon and CLI backend for Proton Drive on Linux"
repository = "https://github.com/CheckForUpdates/neutron-drive"
homepage = "https://github.com/CheckForUpdates/neutron-drive"
readme = "../../README.md"

[lib]
name = "neutron_drive_daemon"
path = "src/lib.rs"

[[bin]]
name = "neutron-drive-daemon"
path = "src/main.rs"

[dependencies]
fuser = { version = "0.15", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
tempfile = "3.10"
fastrand = "2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
ring = "0.17.14"
sha2 = "0.11.0"
base64 = "0.22.1"
hex = "0.4.3"
zeroize = "1.9.1"
flate2 = "1.1.10"
crc32fast = "1.5.3"
url = "2.5.8"
pgp = "0.21.1"
rand = "0.8"
smallvec = "1"
bytes = "1"
zbus = "5"

# Optimize third-party crypto crates in dev/test builds so S2K/Argon2 and OpenPGP
# key derivation in tests stays fast while keeping local crate code unoptimized.
[profile.dev.package."*"]
opt-level = 2
